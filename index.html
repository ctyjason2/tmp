<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3 Minute File</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#111}
.box{width:100%;max-width:480px;background:#fff;border:1px solid #ddd;border-radius:18px;padding:24px}
h1{margin:0 0 8px;font-size:26px}
p{margin:0 0 20px;color:#666;line-height:1.45}
input{width:100%;margin:8px 0 14px}
input[type=password]{height:46px;border:1px solid #ccc;border-radius:10px;padding:0 12px;font-size:16px}
button,a.btn{width:100%;min-height:48px;border:0;border-radius:10px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
button{background:#111;color:#fff}
button.secondary{margin-top:10px;background:#ececec;color:#111}
button:disabled{opacity:.45}
#result{display:none;margin-top:18px;padding:14px;background:#f4f4f4;border-radius:12px;word-break:break-all}
.code{font-size:30px;font-weight:800;letter-spacing:3px;margin:8px 0}
.timer{font-size:22px;font-weight:700;margin:8px 0}
.small{font-size:12px;color:#777;margin-top:14px}
.error{color:#b00020}
</style>
</head>
<body>
<div class="box">
  <h1>3 Minute File</h1>
  <p>Upload a file. The download link expires after 3 minutes.</p>

  <input id="key" type="password" placeholder="Upload key" autocomplete="off">
  <input id="file" type="file">
  <button id="upload">Upload</button>

  <div id="result"></div>
  <div class="small">Maximum file size: 100 MB</div>
</div>

<script>
const API = "https://tmpobj-share.ctyjason2.workers.dev";
const MAX_SIZE = 100 * 1024 * 1024;

const keyInput = document.getElementById("key");
const fileInput = document.getElementById("file");
const uploadButton = document.getElementById("upload");
const result = document.getElementById("result");
let timer = null;

function repoBase() {
  const p = location.pathname.split("/").filter(Boolean);
  if (location.hostname.endsWith("github.io") && p.length) return "/" + p[0];
  return "";
}

function publicLink(code) {
  return location.origin + repoBase() + "/d/" + code;
}

uploadButton.onclick = async () => {
  const key = keyInput.value;
  const file = fileInput.files[0];

  if (!key) return showError("Enter upload key.");
  if (!file) return showError("Choose a file.");
  if (file.size > MAX_SIZE) return showError("File is larger than 100 MB.");

  clearInterval(timer);
  uploadButton.disabled = true;
  uploadButton.textContent = "Uploading...";
  result.style.display = "block";
  result.className = "";
  result.textContent = "Uploading...";

  try {
    const r = await fetch(API + "/upload?name=" + encodeURIComponent(file.name), {
      method: "POST",
      headers: {
        "Content-Type": file.type || "application/octet-stream",
        "X-Upload-Key": key
      },
      body: file
    });

    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Upload failed.");

    const link = publicLink(data.code);

    result.innerHTML = `
      <div>Code</div>
      <div class="code">${escapeHtml(data.code)}</div>
      <div id="timer" class="timer">03:00</div>
      <a class="btn" href="${escapeHtml(link)}">Open Download</a>
      <button class="secondary" id="copy">Copy Link</button>
    `;

    document.getElementById("copy").onclick = async () => {
      await navigator.clipboard.writeText(link);
      document.getElementById("copy").textContent = "Copied";
    };

    startTimer(data.expiresAt);
  } catch (e) {
    showError(e.message || "Upload failed.");
  } finally {
    uploadButton.disabled = false;
    uploadButton.textContent = "Upload";
  }
};

function startTimer(expiresAt) {
  const el = document.getElementById("timer");
  const tick = () => {
    const left = Math.max(0, expiresAt - Date.now());
    const sec = Math.ceil(left / 1000);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    el.textContent = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    if (left <= 0) {
      clearInterval(timer);
      el.textContent = "Expired";
    }
  };
  tick();
  timer = setInterval(tick, 1000);
}

function showError(msg) {
  result.style.display = "block";
  result.className = "error";
  result.textContent = msg;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
