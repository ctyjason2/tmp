<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Download</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#111}
.box{width:100%;max-width:480px;background:#fff;border:1px solid #ddd;border-radius:18px;padding:24px;text-align:center}
h1{margin:0 0 10px;font-size:25px}
.code{font-size:30px;font-weight:800;letter-spacing:3px;margin:14px 0}
a{width:100%;min-height:50px;border-radius:10px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;font-weight:600;margin-top:18px}
.muted{color:#777;line-height:1.45}
.error{color:#b00020}
</style>
</head>
<body>
<div class="box" id="box">
  <h1>Preparing download...</h1>
</div>

<script>
const API = "https://tmpobj-share.ctyjason2.workers.dev";
const box = document.getElementById("box");

const parts = location.pathname.split("/").filter(Boolean);
const dIndex = parts.indexOf("d");
const code = dIndex >= 0 ? parts[dIndex + 1] : "";

if (!/^[A-Za-z0-9]{5}$/.test(code)) {
  box.innerHTML = '<h1>Invalid link</h1><div class="muted">This download link is not valid.</div>';
} else {
  const workerUrl = API + "/d/" + code;
  box.innerHTML = `
    <h1>3 Minute File</h1>
    <div class="code">${code}</div>
    <div class="muted">Tap below to download. The link expires 3 minutes after upload.</div>
    <a href="${workerUrl}">Download</a>
  `;
}
</script>
</body>
</html>
